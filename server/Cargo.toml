[package]
name = "vim-mcp"
version = "0.2.0"
edition = "2021"
description = "MCP server connecting Claude Code to Vim/Neovim"
authors = ["HollowPhobos"]
license = "MIT"
repository = "https://github.com/HollowPhobos/vim-mcp"

[[bin]]
name = "vim-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=1.7.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
